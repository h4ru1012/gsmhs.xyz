name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 새 push가 오면 이전 실행은 취소 (러너 시간 절약)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle (캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      # 테스트는 시크릿 없이 통과하도록 작성됨 (더미 OAuth 값 + 테스트용 SQLite)
      - name: Build & Test
        run: ./gradlew build

      - name: Upload test report (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7
