server:
  port: 8080
  # 재시작/배포 시 처리 중인 요청을 마치고 종료
  shutdown: graceful
  # nginx 등 리버스 프록시 뒤에서 X-Forwarded-*(스킴/호스트/클라이언트 IP)를 신뢰
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        # HTTPS 전용. 로컬 http 테스트 시 SESSION_COOKIE_SECURE=false 로 내려서 사용
        secure: ${SESSION_COOKIE_SECURE:true}
        # 교차 사이트 POST(CSRF) 차단. OAuth 콜백은 top-level GET이라 Lax와 호환
        same-site: lax

spring:
  config:
    # 프로젝트 루트의 .env 파일을 properties 형식으로 읽는다 (없으면 무시).
    # OS 환경변수가 설정돼 있으면 .env보다 우선한다.
    import: "optional:file:.env[.properties]"
  application:
    name: gsmhs.xyz
  thymeleaf:
    # 운영 캐시 활성화. devtools가 개발 실행 시 자동으로 false로 내려준다.
    cache: true
  datasource:
    url: jdbc:sqlite:${GSMHS_DB_PATH:gsmhs.xyz.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  # 관리자로 취급할 DataGSM 계정 이메일 목록 (쉼표 구분)
  admin-emails: ${ADMIN_EMAILS:}

cloudflare:
  # 둘 다 비어 있으면 DNS 연동 없이 동작 (로컬 개발 모드)
  api-token: ${CF_API_TOKEN:}
  zone-id: ${CF_ZONE_ID:}
  base-domain: gsmhs.xyz
  # true면 Cloudflare 프록시(주황 구름) 경유. GitHub Pages 연결 시엔 false 권장.
  proxied: false

datagsm:
  oauth:
    client-id: ${DATAGSM_CLIENT_ID}
    client-secret: ${DATAGSM_CLIENT_SECRET}
    authorization-base-url: https://oauth.authorization.datagsm.kr
    user-info-base-url: https://oauth.resource.datagsm.kr
    redirect-uri: ${DATAGSM_REDIRECT_URI:https://gsmhs.xyz/oauth/callback}
    # scope는 선택 파라미터라 비워두면 서버가 클라이언트에 등록된 기본 권한(self_read)을 적용한다.
    # self_read/self:read 표기가 문서마다 달라 값을 직접 보내는 대신 아예 생략해 모호성을 없앤다.
    scope: ${DATAGSM_SCOPE:}
