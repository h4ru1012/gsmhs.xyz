<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' — gsmhs.xyz'">서브도메인 등록 — gsmhs.xyz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0e1116;
            --surface: #171c24;
            --border: #2a3240;
            --text: #e8ecf1;
            --muted: #8b95a5;
            --accent: #4f8cff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Noto Sans KR", "Noto Sans CJK KR", -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px;
        }
        main {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
        }
        .card {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 32px;
        }
        h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        .sub { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 24px; }
        .error {
            background: rgba(255, 92, 92, 0.1);
            border: 1px solid rgba(255, 92, 92, 0.35);
            color: #ff8f8f;
            font-size: 13px;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .field { margin-bottom: 18px; }
        .hint {
            font-size: 12px;
            color: var(--muted);
            margin-top: 6px;
            line-height: 1.5;
        }
        .subdomain-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        input, textarea {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 11px 12px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        textarea { resize: vertical; min-height: 72px; }
        .radio-row { display: flex; gap: 18px; }
        .radio {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--text);
            cursor: pointer;
        }
        .radio input { width: auto; accent-color: var(--accent); }
        .suffix {
            font-family: "JetBrains Mono", ui-monospace, monospace;
            font-size: 13px;
            color: var(--muted);
            white-space: nowrap;
        }
        .btn {
            display: block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            background: var(--accent);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            padding: 13px 0;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .btn:hover { opacity: 0.88; }
        .btn.secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            margin-top: 10px;
        }
        footer {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 24px;
            text-align: center;
            font-size: 13px;
            color: var(--muted);
        }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .footer-links a {
            color: var(--muted);
            text-decoration: none;
        }
        .footer-links a:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>
<main class="card">
    <h1 th:text="${pageTitle}">서브도메인 등록</h1>
    <p class="sub">등록 즉시 DNS 레코드가 설정됩니다.</p>

    <div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div>

    <form method="post" th:action="@{${formAction}}">
        <div class="field">
            <label for="name">프로젝트 이름</label>
            <input type="text" id="name" name="name" placeholder="프로젝트"
                   th:value="${project.name}" maxlength="50" required>
        </div>

        <div class="field">
            <label for="subdomain">서브도메인</label>
            <div class="subdomain-row">
                <input type="text" id="subdomain" name="subdomain" placeholder="project"
                       th:value="${project.subdomain}" pattern="[a-z0-9-]+" required>
                <span class="suffix">.gsmhs.xyz</span>
            </div>
        </div>

        <div class="field">
            <label for="cnameTarget">연결할 호스트 (CNAME 대상)</label>
            <input type="text" id="cnameTarget" name="cnameTarget" placeholder="username.example.com"
                   th:value="${project.cnameTarget}" required>
            <p class="hint">
                GitHub Pages, Vercel 같은 호스팅의 도메인을 입력하세요. 경로(/...)는 쓸 수 없어요.<br>
                해당 호스팅의 커스텀 도메인 설정에 <b>서브도메인.gsmhs.xyz</b>를 등록해야 실제로 연결됩니다.
            </p>
        </div>

        <div class="field">
            <label for="description">프로젝트 소개 (선택)</label>
            <textarea id="description" name="description" placeholder="어떤 프로젝트인지 한두 줄로 소개해 주세요"
                      th:text="${project.description}"></textarea>
        </div>

        <div class="field">
            <label for="githubUrl">GitHub 링크 (선택)</label>
            <input type="url" id="githubUrl" name="githubUrl" placeholder="https://github.com/me/my-project"
                   th:value="${project.githubUrl}">
        </div>

        <div class="field">
            <label>공개 여부</label>
            <div class="radio-row">
                <label class="radio">
                    <input type="radio" name="visible" value="true" th:checked="${project.visible}"> 공개
                </label>
                <label class="radio">
                    <input type="radio" name="visible" value="false" th:checked="${!project.visible}"> 비공개
                </label>
            </div>
            <p class="hint">비공개로 하면 메인 페이지 목록에 표시되지 않아요. DNS 연결은 동일하게 동작합니다.</p>
        </div>

        <button type="submit" class="btn" th:text="${submitLabel}">등록하기</button>
        <a class="btn secondary" href="/">취소</a>
    </form>
</main>

<footer>
    <div class="footer-links">
        <a href="/">홈</a>
        <a href="/tos">이용약관</a>
        <a href="/privacy">개인정보 보호정책</a>
    </div>
    <p>&copy; 2024 gsmhs.xyz. All rights reserved.</p>
</footer>
</body>
</html>
