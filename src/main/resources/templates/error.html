<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="'오류 ' + ${status} + ' — GSMHS.xyz'">오류 — GSMHS.xyz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script>(function(){try{var t=localStorage.getItem('gsmhs-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0a;--surface:#141414;--border:#262626;--border-2:#383838;
  --text:#f5f5f5;--text-2:#a3a3a3;--text-3:#6f6f6f;
  --btn-bg:#f5f5f5;--btn-fg:#0a0a0a;
  --sans:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;
  --mono:'Noto Sans Mono','Noto Sans KR',monospace;
  --r-s:9px;
}
html{color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
[data-theme="light"]{
  --bg:#ffffff;--surface:#ffffff;--border:#e8e8e8;--border-2:#d6d6d6;
  --text:#141414;--text-2:#5c5c5c;--text-3:#8a8a8a;
  --btn-bg:#141414;--btn-fg:#ffffff;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:460px;width:100%;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:44px 32px}
.code{font-family:var(--mono);font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1}
.title{font-size:19px;font-weight:800;margin-top:18px}
.desc{font-size:14px;color:var(--text-2);line-height:1.7;margin-top:12px}
.home{display:inline-block;margin-top:26px;background:var(--btn-bg);color:var(--btn-fg);font-weight:700;font-size:14px;text-decoration:none;padding:11px 22px;border-radius:var(--r-s)}
.brand{margin-top:28px;font-family:var(--mono);font-size:12px;color:var(--text-3)}
</style>
</head>
<body>
<main class="card">
  <div class="code" th:text="${status} ?: '오류'">500</div>
  <h1 class="title" th:switch="${status}">
    <span th:case="404">페이지를 찾을 수 없어요</span>
    <span th:case="403">접근 권한이 없어요</span>
    <span th:case="*">문제가 발생했어요</span>
  </h1>
  <p class="desc">요청을 처리하는 중 오류가 발생했습니다.<br>주소를 다시 확인하거나 잠시 후 다시 시도해 주세요.</p>
  <a class="home" href="/">홈으로 돌아가기</a>
  <div class="brand">GSMHS.xyz</div>
</main>
</body>
</html>
